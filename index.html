<link rel="stylesheet" href="popup_bundle_helper.css" />

<div class="wrap" id="app">
  <div class="masthead">
    <h1>台中大遠百 滿額回饋試算</h1>
    <div class="sub">
      每滿2,000元送200元（累加）／單筆跨過10,000元再加碼送200元
    </div>
  </div>

  <div class="section-label">選擇品項數量</div>
  <div class="panel">
    <div class="items" id="items"></div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="section-label">目前結帳金額</div>
  <div class="result-grid">
    <div class="r-tile hero">
      <div class="lbl">結帳合計</div>
      <div class="val" id="totalAmount">NT$0</div>
    </div>
    <div class="r-tile">
      <div class="lbl">禮券回饋（自動計算）</div>
      <div class="val" id="rebateAmount">NT$0</div>
    </div>
    <div class="r-tile rate">
      <div class="lbl">回饋率</div>
      <div class="val" id="rebateRate">—</div>
    </div>
  </div>

  <div class="footer-note">
    規則：單筆消費每滿2,000元送200元禮券（累加），且單筆跨過10,000元門檻時額外再加碼送200元。回饋
    = floor(金額/2000)×200 +
    floor(金額/10000)×200。此工具僅供現場估算參考，實際以百貨公司公告為準。
  </div>
</div>

<script src="popup_bundle_helper.js"></script>
